<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Street Nodes · 独立转头实验</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e7edf7;font:15px system-ui}main{max-width:1240px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:23px;margin:0}small,p{color:#a5b5cd}.stage{position:relative;aspect-ratio:832/480;background:#030712;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;cursor:grab}canvas{width:100%;height:100%;display:block}.tag{position:absolute;top:16px;left:16px;background:#0a1425dd;padding:10px 14px;border-radius:8px;pointer-events:none}.arrow{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:28px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}button,input{font:inherit}button{background:#1e3655;color:white;border:1px solid #49617e;padding:10px 16px;border-radius:8px;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}input[type=range]{flex:1;min-width:160px;accent-color:#73b4ff}#notice{min-height:40px;color:#edce91}#loading{color:#8eb8ed}label{min-width:86px}.sub{font-size:12px}a{color:#8eb8ed}button:focus-visible{outline:2px solid #7bbaff}</style><main>
<header><div><h1>街道路点 · 独立转头实验</h1><small>路径位置与转头角度独立 · 水平视角 ±60° · 不支持俯仰</small></div><button id="reset">回到起点</button></header>
<div class="stage" id="stage" tabindex="0" aria-label="街景视窗"><canvas id="scene" width="832" height="480" aria-label="沿街道的实际生成画面"></canvas><div class="tag" id="state">正在加载路径…</div><button class="arrow" id="advance" aria-label="沿街道前进一个路点">⌃</button></div>
<div class="row"><button id="back">后退</button><label for="route">路径位置</label><input id="route" type="range" min="0" max="4" step="0.001" value="0"><button id="forward">前进</button></div>
<div class="row"><button id="left">向左看</button><label for="heading">水平转头</label><input id="heading" type="range" min="-60" max="60" step="0.25" value="0"><button id="right">向右看</button><button id="center">看向街道前方</button></div>
<p>W / S 沿原路线前进、后退；A / D 或横向拖动转头。转头不会改变路径位置。</p>
<p id="notice" role="status"></p><p id="loading"></p><p class="sub">实验数据：连续向前生成的逐帧观测。路线刻度为请求单位，不是实测米数。起点、中点、终点分别从同一生成状态采集左右 ±60° 视角；过渡帧仅提供前进画面。生成场景可能漂移，尚未达到稳定街景标准。</p>
<div id="nodes" class="row" aria-label="可观察路点"></div><button id="endpoint">前往终点</button> <a id="download" hidden download>下载本次实验数据</a>
</main><script>
'use strict';const $=s=>document.getElementById(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let all=[],routeFrames=[],endViews=[],nodes=[],images=new Map(),s=0,targetS=0,yaw=0,maxS=4,last=performance.now(),drag=false,lastX=0,drawn='',ready=0;const keys=new Set(),ctx=$('scene').getContext('2d');
function activeNode(){return nodes.find(n=>Math.abs(s-n)<.002&&Math.abs(s-targetS)<.002)}
function hasSides(){return activeNode()!==undefined}
function viewsHere(){return endViews.filter(f=>Math.abs(f.s-activeNode())<.0001)}
function setYaw(v){yaw=hasSides()?clamp(v,-60,60):0;paint()}
function paint(){if(!routeFrames.length)return;let frame=routeFrames.reduce((a,b)=>Math.abs(b.s-s)<Math.abs(a.s-s)?b:a);if(hasSides())frame=viewsHere().reduce((a,b)=>Math.abs(b.yaw-yaw)<Math.abs(a.yaw-yaw)?b:a);const image=images.get(frame.url);if(image&&drawn!==frame.url){ctx.drawImage(image,0,0,832,480);drawn=frame.url;$('scene').dataset.frame=String(frame.i)}$('state').textContent='路径 '+s.toFixed(2)+' / '+maxS.toFixed(2)+' · 转头 '+yaw.toFixed(1)+'°';$('route').value=s;$('heading').value=yaw;for(const id of ['heading','left','right'])$(id).disabled=!hasSides();$('notice').textContent=!image?'正在预载当前位置画面…':hasSides()?'路点 '+activeNode()+'：可左右观察 ±60°。场景一致性仍在测试，请留意车辆和建筑是否漂移。':'正在路点之间移动；到达路点后可以转头。';$('forward').disabled=$('advance').disabled=targetS>=maxS;$('back').disabled=targetS<=0;}
function move(delta){if(Math.abs(s-targetS)>.002)return;const next=delta>0?nodes.find(n=>n>targetS+.002):[...nodes].reverse().find(n=>n<targetS-.002);if(next!==undefined){targetS=next;yaw=0;paint()}}
$('forward').onclick=$('advance').onclick=()=>move(.4);$('back').onclick=()=>move(-.4);$('route').oninput=e=>{s=targetS=nodes.reduce((a,b)=>Math.abs(b-(+e.target.value))<Math.abs(a-(+e.target.value))?b:a);yaw=0;paint()};$('heading').oninput=e=>setYaw(+e.target.value);$('left').onclick=()=>setYaw(yaw+15);$('right').onclick=()=>setYaw(yaw-15);$('center').onclick=()=>setYaw(0);$('reset').onclick=()=>{s=targetS=yaw=0;paint()};$('endpoint').onclick=()=>{s=targetS=maxS;yaw=0;paint()};
$('stage').onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;drag=true;lastX=e.clientX;$('stage').setPointerCapture(e.pointerId);$('stage').focus()};$('stage').onpointermove=e=>{if(drag){setYaw(yaw+(e.clientX-lastX)*.25);lastX=e.clientX}};$('stage').onpointerup=$('stage').onpointercancel=()=>drag=false;
window.onkeydown=e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(['KeyW','KeyS','KeyA','KeyD','ArrowLeft','ArrowRight'].includes(e.code)){keys.add(e.code);e.preventDefault()}};window.onkeyup=e=>keys.delete(e.code);window.onblur=()=>{keys.clear();drag=false};
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(keys.has('KeyW'))move(dt);if(keys.has('KeyS'))move(-dt);if(keys.has('KeyA')||keys.has('ArrowLeft'))setYaw(yaw+dt*45);if(keys.has('KeyD')||keys.has('ArrowRight'))setYaw(yaw-dt*45);if(Math.abs(s-targetS)>.0001){s+=Math.sign(targetS-s)*Math.min(Math.abs(targetS-s),dt);paint()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
async function start(){const query=new URLSearchParams(location.search);let url=query.get('manifest');if(!url){const r=await fetch('/outputs/route-probes/branches-latest.json');if(!r.ok)throw Error('新的路线实验尚未完成');url=(await r.json()).manifest}const r=await fetch(url);if(!r.ok)throw Error('无法加载路径');const m=await r.json();if(m.schema!=='streetview-route-probe-v1')throw Error('需要专用路径数据，不能混用旧观测目录');const base=new URL(url,location.href);$('download').href=new URL('evidence.zip',base).href;$('download').hidden=true;all=m.observations.map((f,i)=>({...f,i,url:new URL(f.image,base).href}));routeFrames=all.filter((f,i)=>f.kind==='route'&&(f.segment!=='initial'||!all.slice(i+1).some(g=>g.segment==='initial')));if(!routeFrames.length)throw Error('没有前进路线帧');maxS=Math.max(...routeFrames.map(f=>f.s));endViews=[...routeFrames.filter(f=>Number.isInteger(f.s)),...all.filter(f=>f.kind==='node-sweep'&&Math.abs(f.yaw)>.01)];nodes=[...new Set(all.filter(f=>f.kind==='node-sweep').map(f=>f.s))].sort((a,b)=>a-b);for(const n of nodes){const btn=document.createElement('button');btn.textContent='路点 '+n;btn.onclick=()=>{s=targetS=n;yaw=0;paint()};$('nodes').append(btn)}$('route').max=maxS;let next=0;async function worker(){while(next<all.length){const f=all[next++];const im=new Image();im.src=f.url;await im.decode();images.set(f.url,im);ready++;$('loading').textContent='已预载 '+ready+' / '+all.length+' 帧；路线帧 '+routeFrames.length;paint()}}await Promise.all(Array.from({length:6},worker));$('loading').textContent='预载完成 · '+routeFrames.length+' 个前进帧 / '+endViews.length+' 个路点观测 · '+nodes.length+' 个可转头路点'}start().catch(e=>{$('notice').textContent=e.message;$('state').textContent='数据尚未就绪'});
</script></html>
