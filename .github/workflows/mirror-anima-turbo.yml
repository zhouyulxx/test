name: Mirror Anima Turbo to a GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag for the reconstructed model parts
        required: true
        type: string
        default: anima-turbo-v1.1-mirror

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install 'requests>=2.32,<3'
      - name: Create split GitHub Release (only on explicit manual dispatch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python anima-studio/mirror_models.py
